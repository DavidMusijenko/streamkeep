<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  :root {
    --bg: #fff; --fg: #111; --muted: #666; --line: #e5e5e5; --card: #f6f6f6;
    --accent: #ff0033; --ok: #2e7d32; --bad: #c62828; --btn: #ececec; --btn-fg: #111;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #1e1e1e; --fg: #eee; --muted: #999; --line: #333; --card: #2a2a2a; --btn: #3a3a3a; --btn-fg: #eee; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; width: 330px; background: var(--bg); color: var(--fg);
         font: 13px -apple-system, system-ui, sans-serif; }
  header { display: flex; align-items: center; gap: 8px; padding: 12px 14px 8px; }
  header h1 { font-size: 14px; margin: 0; flex: 1; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); display: inline-block; }
  .dot.ok { background: var(--ok); } .dot.bad { background: var(--bad); }
  #helper { font-size: 11px; color: var(--muted); }
  section { padding: 10px 14px; border-top: 1px solid var(--line); }
  h2 { font-size: 11px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: 0 0 8px; }
  .card { background: var(--card); border-radius: 8px; padding: 10px; }
  .title { font-weight: 600; margin-bottom: 4px; overflow: hidden; text-overflow: ellipsis; display: -webkit-box;
           -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
  .status { color: var(--muted); margin-bottom: 8px; }
  .bar { height: 4px; background: var(--line); border-radius: 2px; overflow: hidden; margin-bottom: 8px; }
  .bar > div { height: 100%; background: var(--accent); width: 0; transition: width .4s; }
  .row { display: flex; gap: 6px; flex-wrap: wrap; }
  button { border: 0; border-radius: 6px; padding: 6px 10px; background: var(--btn); color: var(--btn-fg);
           font: 500 12px -apple-system, system-ui, sans-serif; cursor: pointer; }
  button.primary { background: var(--accent); color: #fff; }
  button.danger { color: var(--bad); }
  button:disabled { opacity: .5; cursor: default; }
  label.set { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 5px 0; }
  label.set span small { display: block; color: var(--muted); font-size: 11px; }
  select { font: 12px -apple-system, system-ui, sans-serif; max-width: 150px; }
  .list { margin: 8px 0; max-height: 150px; overflow-y: auto; }
  .item { display: flex; align-items: center; gap: 6px; padding: 4px 0; border-bottom: 1px solid var(--line); }
  .item:last-child { border-bottom: 0; }
  .item .name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .item .meta { color: var(--muted); font-size: 11px; white-space: nowrap; }
  .item button { padding: 2px 6px; background: transparent; color: var(--muted); }
  .muted { color: var(--muted); }
  a { color: var(--accent); }
  [hidden] { display: none !important; }
</style>
</head>
<body>
  <header>
    <h1>StreamKeep</h1>
    <span id="helper"><span class="dot" id="dot"></span> <span id="helperText">checking…</span></span>
  </header>

  <section id="perm" hidden>
    <div class="card">
      <div class="status">StreamKeep needs access to YouTube and to its local helper (127.0.0.1) to save videos.</div>
      <button class="primary" id="bPerm">Allow access</button>
    </div>
  </section>

  <section id="setup" hidden>
    <div class="card">
      <div class="status">The StreamKeep helper isn't running. It does the saving on your computer.</div>
      <a id="setupLink" href="https://github.com/DavidMusijenko/streamkeep#install" target="_blank" rel="noopener">How to install it</a>
    </div>
  </section>

  <section>
    <h2>This video</h2>
    <div class="card">
      <div id="noVideo" class="muted">Open a YouTube video to save it.</div>
      <div id="video" hidden>
        <div class="title" id="vTitle"></div>
        <div class="status" id="vStatus"></div>
        <div class="bar" id="vBarWrap" hidden><div id="vBar"></div></div>
        <div class="row">
          <button class="primary" id="bPlay" hidden>Play offline copy</button>
          <button class="primary" id="bBack" hidden>Back to YouTube</button>
          <button class="primary" id="bSave" hidden>Save now</button>
          <button id="bCancel" hidden>Cancel</button>
          <button id="bResave" hidden title="Delete and download again with the current quality setting">Re-save at current quality</button>
          <button class="danger" id="bDelete" hidden>Delete</button>
        </div>
      </div>
    </div>
  </section>

  <section>
    <h2>Settings</h2>
    <label class="set"><span>Quality<small>Highest to download</small></span>
      <select id="quality">
        <option value="0">Best available</option>
        <option value="2160">2160p (4K)</option>
        <option value="1440">1440p</option>
        <option value="1080">1080p</option>
        <option value="720">720p</option>
        <option value="480">480p</option>
      </select></label>
    <label class="set"><span>Format<small>VP9/AV1 look sharper than H.264</small></span>
      <select id="codec">
        <option value="auto">Best supported</option>
        <option value="h264">H.264 only</option>
      </select></label>
    <label class="set"><span>Save videos<small>When to download</small></span>
      <select id="autoSave">
        <option value="true">Every video I open</option>
        <option value="false">Only when I click Save</option>
      </select></label>
    <label class="set"><span>Switch to saved copy<small>When the internet drops</small></span>
      <select id="autoSwitch">
        <option value="true">Automatically</option>
        <option value="false">Only when I click Play</option>
      </select></label>
    <label class="set"><span>Skip long videos<small>Don't auto-save if longer than</small></span>
      <select id="maxMinutes">
        <option value="0">No limit</option>
        <option value="30">30 min</option>
        <option value="60">1 hour</option>
        <option value="120">2 hours</option>
        <option value="180">3 hours</option>
      </select></label>
    <label class="set"><span>Keep saved videos<small>Since last watched</small></span>
      <select id="days">
        <option value="1">1 day</option>
        <option value="3">3 days</option>
        <option value="7">7 days</option>
        <option value="30">30 days</option>
        <option value="0">Forever</option>
      </select></label>
    <label class="set"><span>Cache size limit<small>Oldest are deleted first</small></span>
      <select id="maxgb">
        <option value="5">5 GB</option>
        <option value="10">10 GB</option>
        <option value="30">30 GB</option>
        <option value="50">50 GB</option>
        <option value="100">100 GB</option>
        <option value="0">No limit</option>
      </select></label>
  </section>

  <section>
    <h2>Saved videos</h2>
    <div id="cacheSummary" class="muted">…</div>
    <div class="list" id="list"></div>
    <div class="row">
      <button id="bOpen">Open folder</button>
      <button class="danger" id="bClear">Clear all</button>
    </div>
  </section>

  <script src="popup.js"></script>
</body>
</html>
